<!DOCTYPE html>
<html lang="id" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Scheduler</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-100 flex items-center justify-center h-screen transition-colors duration-300">

    <div class="bg-white dark:bg-gray-800 p-8 rounded-lg shadow-lg w-full max-w-md">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-blue-600 dark:text-blue-400">Scheduler</h1>
            <p class="text-sm text-gray-500 mt-2">Masuk untuk mengelola waktu dan tugasmu</p>
        </div>

        <form id="loginForm" class="space-y-5">
            <div>
                <label class="block text-sm font-medium mb-1">Email</label>
                <input type="email" id="email" required class="w-full p-3 border rounded-lg dark:bg-gray-700 dark:border-gray-600 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Masukkan email">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Password</label>
                <input type="password" id="password" required class="w-full p-3 border rounded-lg dark:bg-gray-700 dark:border-gray-600 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Masukkan password">
            </div>
            
            <button type="submit" class="w-full bg-blue-600 text-white p-3 rounded-lg font-bold hover:bg-blue-700 transition">
                Masuk ke Dashboard
            </button>
        </form>

        <div class="mt-6 text-center text-sm">
            Belum punya akun? <a href="#" class="text-blue-600 dark:text-blue-400 font-bold hover:underline">Daftar sekarang</a>
        </div>
    </div>

    <script>
        // Simulasi pengalihan ke dashboard saat tombol diklik
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            // Nanti dihubungkan ke API auth di sini
            window.location.href = 'index.html'; 
        });
    </script>
</body>
</html>
